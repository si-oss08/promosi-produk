<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromoForge - Sistem Promosi Masa Depan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="overflow-x-hidden">
  <nav class="glass-card sticky top-0 z-40 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-2 font-bold text-xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">
      ⚡ PROMOFORGE
    </div>
    <div class="hidden md:flex gap-6 text-sm font-medium text-gray-300">
      <a href="index.html" class="text-cyan-400">Home</a>
      <a href="produk.html" class="hover:text-cyan-400 transition">Produk</a>
      <a href="promosi.html" class="hover:text-cyan-400 transition">Promosi</a>
    </div>
    <a href="login.html" class="glass-card text-xs font-semibold px-4 py-2 rounded-lg border border-cyan-500/30 text-cyan-400 hover:glow-cyan transition">
      Admin Panel
    </a>
  </nav>

  <header class="relative py-24 px-6 max-w-7xl mx-auto flex flex-col items-center text-center">
    <div class="absolute inset-0 bg-gradient-to-tr from-purple-500/10 via-transparent to-cyan-500/10 blur-3xl pointer-events-none"></div>
    <span class="text-xs font-bold tracking-widest text-purple-400 uppercase bg-purple-500/10 px-4 py-1.5 rounded-full border border-purple-500/20 mb-6">Introducing Ecosystem</span>
    <h1 class="text-4xl md:text-6xl font-extrabold max-w-3xl leading-tight tracking-tight">
      Sistem Manajemen Promosi <br>
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-400 to-purple-500">Interaktif & Data-Driven</span>
    </h1>
    <p class="mt-6 text-gray-400 max-w-xl text-sm md:text-base">Dapatkan update diskon produk premium terbaik secara real-time dari platform serverless pintar kami.</p>
    <div class="mt-10 flex flex-wrap gap-4 justify-center">
      <a href="promosi.html" class="bg-gradient-to-r from-cyan-500 to-blue-600 font-medium px-6 py-3 rounded-lg shadow-lg hover:glow-cyan transition">Lihat Promo Aktif</a>
      <a href="produk.html" class="glass-card font-medium px-6 py-3 rounded-lg border border-gray-700 hover:bg-gray-800 transition">Katalog Produk</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 pb-20">
    <h2 class="text-xl font-bold text-gray-200 mb-6 flex items-center gap-2">🔥 Promo Flash Terkini</h2>
    <div id="highlight-container" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 md:gap-4"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/shared.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (!sessionStorage.getItem("init_fresh")) {
        sessionStorage.clear();
        sessionStorage.setItem("init_fresh", "true");
      }

      await AppState.init();
      if (typeof lucide !== 'undefined') lucide.createIcons();

      const promosi = AppState.getPromosi() || [];
      const produk = AppState.getProduk() || [];
      const container = document.getElementById("highlight-container");
      
      if (!container) return;
      container.innerHTML = "";

      if(promosi.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center col-span-2 lg:col-span-5 py-6">Belum ada promosi aktif saat ini.</p>';
        return;
      }

      // Tampilkan maksimal 5 promo teratas agar pas di layar laptop
      const activePromos = promosi.slice(0, 5);

      activePromos.forEach((promo, i) => {
        // Ambil relasi produk
        const promoProdId = promo.id_produk || promo.id_produck;
        const prod = produk.find(p => (p.id_produk || p.id_produck) == promoProdId) || {};
        
        // Pilihan fallback properti database
        const judul_promo = promo.judul_promosi || promo.nama_promosi || "Promo Menarik";
        const link_gambar = prod.gambar || prod.url_gambar || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30';
        const diskon_nilai = promo.diskon || promo.diskon_persen || 0;
        const deskripsi_promo = promo.deskripsi || "Dapatkan harga spesial sebelum masa berlaku habis!";
        const tgl_selesai = promo.tanggal_selesai || promo.selesai;

        container.innerHTML += `
          <div class="glass-panel bg-gray-900/40 backdrop-blur-md rounded-xl overflow-hidden p-3 flex flex-col gap-2 text-sm border border-gray-800">
            <div class="relative bg-gray-950 rounded-lg overflow-hidden">
              <img src="${link_gambar}" class="w-full h-28 sm:h-36 lg:h-40 object-cover" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30';">
              <span class="absolute top-2 left-2 bg-red-500 font-bold px-2 py-0.5 text-[9px] rounded-md shadow-lg text-white">-${diskon_nilai}%</span>
            </div>
            <div class="flex-1 flex flex-col justify-between">
              <div>
                <h4 class="font-bold text-xs lg:text-sm text-white line-clamp-1">${judul_promo}</h4>
                <p class="text-gray-400 text-[11px] line-clamp-1">${deskripsi_promo}</p>
              </div>
              <div class="mt-3 pt-2 border-t border-gray-800/60 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                <div id="cd-landing-${i}" class="text-[10px] text-cyan-400 font-mono"></div>
                <a href="detail-promosi.html?id=${promo.id_promosi || promo.id}" class="text-[11px] font-semibold text-cyan-400 hover:underline ml-auto sm:ml-0">Detail</a>
              </div>
            </div>
          </div>
        `;
        
        if (typeof initCountdown === 'function' && tgl_selesai) {
          setTimeout(() => initCountdown(tgl_selesai, `cd-landing-${i}`), 50);
        }
      });
    });
  </script>
</body>
</html>
