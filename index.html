<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO-MOTION | Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col">

  <nav class="glass-panel sticky top-0 z-40 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
      <div class="w-10 h-10 rounded-xl bg-neon-gradient flex items-center justify-center font-bold text-white shadow-lg">P</div>
      <span class="text-xl font-bold tracking-wider text-white">PRO<span class="text-neon-cyan">-MOTION</span></span>
    </div>
    <div class="hidden md:flex items-center gap-8 font-medium">
      <a href="index.html" class="text-neon-cyan font-bold">Home</a>
      <a href="produk.html" class="hover:text-neon-cyan transition">Produk</a>
      <a href="promosi.html" class="hover:text-neon-cyan transition">Promosi Aktif</a>
      <a href="login.html" class="px-5 py-2 rounded-xl bg-gray-800 border border-gray-700 hover:border-cyan-500 transition text-sm">Admin Access</a>
    </div>
    <button class="md:hidden text-white" onclick="toggleMobileMenu()"><i data-lucide="menu"></i></button>
  </nav>

  <div id="mobile-menu" class="hidden glass-panel fixed top-[73px] left-0 w-full z-30 flex flex-col p-6 gap-4 border-t border-gray-800 md:hidden">
    <a href="index.html" class="py-2 border-b border-gray-800 text-neon-cyan">Home</a>
    <a href="produk.html" class="py-2 border-b border-gray-800">Produk</a>
    <a href="promosi.html" class="py-2 border-b border-gray-800">Promosi Aktif</a>
    <a href="login.html" class="w-full mt-2 text-center py-3 rounded-xl bg-neon-gradient text-white font-semibold">Admin Access</a>
  </div>

  <main class="flex-1 p-6 md:p-10 max-w-[1600px] mx-auto w-full flex flex-col gap-16 py-10">
    <div class="text-center max-w-3xl mx-auto flex flex-col gap-6">
      <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight leading-tight text-white">
        Dapatkan Penawaran Eksklusif <br><span class="bg-clip-text text-transparent bg-neon-gradient">Produk Terbaik Kami</span>
      </h1>
      <p class="text-gray-400 md:text-lg">Nikmati potongan harga melimpah sepanjang periode promosi aktif startup kami.</p>
      <div class="flex gap-4 justify-center mt-4">
        <a href="promosi.html" class="px-8 py-3 rounded-xl bg-neon-gradient text-white font-semibold hover:opacity-90 shadow-xl transition">Lihat Promo</a>
        <a href="produk.html" class="px-8 py-3 rounded-xl bg-gray-900 border border-gray-800 text-gray-300 hover:border-gray-700 transition">Jelajahi Produk</a>
      </div>
    </div>

    <div>
      <h2 class="text-2xl font-bold text-white mb-8">🔥 Highlight Promosi Berjalan</h2>
      <div id="highlight-container" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 md:gap-4">
        </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/shared.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await AppState.init();
      lucide.createIcons();

      const promosi = AppState.getPromosi().slice(0, 3);
      const produk = AppState.getProduk();
      const container = document.getElementById("highlight-container");

      if(promosi.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center col-span-3">Belum ada promosi aktif.</p>';
        return;
      }

      promosi.forEach((promo, i) => {
        const prod = produk.find(p => p.id_produk === promo.id_produk) || {};
        container.innerHTML += `
          <div class="glass-card rounded-2xl overflow-hidden p-5 flex flex-col gap-4">
            <div class="relative">
              <img src="${prod.gambar || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30'}" class="w-full h-48 object-cover rounded-xl" loading="lazy">
              <span class="absolute top-3 left-3 bg-red-500 font-bold px-3 py-1 text-xs rounded-full shadow-lg">DISKON ${promo.diskon}%</span>
            </div>
            <div>
              <h4 class="font-bold text-lg text-white mb-1">${promo.judul_promosi}</h4>
              <p class="text-gray-400 text-sm line-clamp-2">${promo.deskripsi}</p>
            </div>
            <div class="mt-auto pt-3 border-t border-gray-800 flex justify-between items-center">
              <div id="cd-landing-${i}"></div>
              <a href="detail-promosi.html?id=${promo.id_promosi}" class="text-xs font-semibold text-neon-cyan flex items-center gap-1 hover:underline">Detail</a>
            </div>
          </div>
        `;
        setTimeout(() => initCountdown(promo.tanggal_selesai, `cd-landing-${i}`), 50);
      });
    });
  </script>
</body>
</html>
